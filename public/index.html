<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aileen — Colorado News Press</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2efe7;
        color: #171717;
        font-family: Arial, sans-serif;
      }
      main { width: min(720px, calc(100% - 40px)); }
      small { letter-spacing: .13em; text-transform: uppercase; }
      h1 { max-width: 620px; margin: 18px 0; font: 400 clamp(48px, 9vw, 92px)/.92 Georgia, serif; }
      p { max-width: 520px; font-size: 18px; line-height: 1.55; }
    </style>
  </head>
  <body>
    <main>
      <small>Colorado News Press</small>
      <h1>How can Aileen help?</h1>
      <p>Ask about advertising, subscriptions, public notices, archives, events, or the right newsroom contact.</p>
    </main>
    <script src="/aileen/aileen-widget.js" data-endpoint="/chat"></script>
  </body>
</html>
