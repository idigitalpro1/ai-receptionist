services:
  ai-receptionist:
    build: .
    container_name: ai-receptionist
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:${PORT:-8787}"
    env_file: .env
    environment:
      - PORT=${PORT:-8787}
      - HOST=${HOST:-0.0.0.0}
      - SIP_DOMAIN=${SIP_DOMAIN:-1722.3cx.cloud}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
